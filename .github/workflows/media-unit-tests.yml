name: Media Capability Unit Tests

on:
  pull_request:
    paths:
      - 'local_video_ingest.py'
      - 'media_capabilities.py'
      - 'video_ir_indexing.py'
      - 'gemini_index_backend.py'
      - 'video_transcription.py'
      - 'youtube_private_publisher.py'
      - 'publication_lock.py'
      - 'media_receipt_projection.py'
      - 'media_watch_scan.py'
      - 'media_node_adapter.py'
      - 'pyproject.toml'
      - 'youtube_ai_manager.py'
      - 'test_*video*.py'
      - 'test_media_capabilities.py'
      - 'test_indexer_safety_contract.py'
      - 'test_media_watch_scan.py'
      - 'test_media_node_adapter.py'
      - 'test_publication_lock.py'
      - 'test_media_receipt_projection.py'
      - 'test_video_transcription.py'
      - 'test_youtube_private_publisher.py'
      - '.github/workflows/media-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-media-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Media Worker package without cloud dependencies
        run: python -m pip install -e .
      - name: Validate installed CLI interfaces
        run: |
          agentos-media-ingest --help
          agentos-media-scan --help
          agentos-media-index --help
          python -c "from media_node_adapter import create_adapter; assert create_adapter().describe()['live_verified'] is False"
      - name: Execute offline tests without API credentials
        shell: bash
        run: |
          python -m unittest -v \
            test_local_video_ingest \
            test_media_capabilities \
            test_video_ir_indexing \
            test_gemini_index_backend \
            test_indexer_safety_contract \
            test_video_transcription \
            test_youtube_private_publisher \
            test_publication_lock \
            test_media_receipt_projection \
            test_media_watch_scan \
            test_media_node_adapter
